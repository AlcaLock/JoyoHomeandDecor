services:
  mysql:
    image: mysql:8.0
    container_name: joyohyd-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_password_before_public_demo}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-joyohyd}
      MYSQL_USER: ${MYSQL_USER:-joyohyd}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_app_password_before_public_demo}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
