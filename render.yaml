services:
  - type: web
    runtime: docker
    name: joyohyd-portfolio-api
    dockerContext: ./Server
    dockerfilePath: ./Server/Dockerfile
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /producto
    envVars:
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  - type: web
    runtime: static
    name: joyohyd-portfolio-app
    rootDir: app
    autoDeployTrigger: commit
    buildCommand: >-
      npm ci &&
      node scripts/set-api-url.js &&
      npm run build
    staticPublishPath: app/dist/app
    envVars:
      - key: PUBLIC_API_URL
        sync: false
