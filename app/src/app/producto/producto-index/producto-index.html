<div class="catalog-layout">
  <h1 class="catalog-title">{{ 'product.list_title' | translate }}</h1>

  <div class="catalog-body">
    <aside class="catalog-sidebar">
      <app-product-filters
        categoryLabel="Espacio del hogar"
        [categoryOptions]="categoryFilterOptions"
        materialLabel="Tipo de mueble"
        [materialOptions]="materialFilterOptions"
        [priceBounds]="priceBounds"
        (filtersChange)="onFiltersChange($event)"
      />
    </aside>

    <div class="catalog-content">
      <app-product-grid
        [products]="productCards"
        [hideCta]="isAdmin()"
        emptyMessage="No encontramos muebles con estos filtros. Probá ajustando el precio o quitando alguna etiqueta."
        (addToCart)="onAddToCart($event)"
        (viewDetail)="detalle($event)"
      />
    </div>
  </div>
</div>
