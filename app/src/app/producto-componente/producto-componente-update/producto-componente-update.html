<div class="producto-componente-form">
  <h2 class="form-title">Actualizar Relación Producto-Componente</h2>

  <form [formGroup]="formRelacion" (ngSubmit)="onSubmit()">
    <!-- Producto (solo lectura) -->
    <div class="component-select-container">
      <mat-form-field appearance="outline">
        <mat-label>Producto</mat-label>
        <input matInput [value]="selectedProductoNombre" disabled />
      </mat-form-field>
    </div>

    <!-- Tamaños -->
    <mat-card>
      <mat-card-header>
        <mat-card-title>Tamaños</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-form-field appearance="outline">
          <mat-select multiple formControlName="tamanos">
            <mat-option *ngFor="let t of tamanos" [value]="t.id"
              >{{ t.nombre }}</mat-option
            >
          </mat-select>
        </mat-form-field>
      </mat-card-content>
    </mat-card>

    <!-- Colores -->
    <mat-card>
      <mat-card-header>
        <mat-card-title>Colores</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-form-field appearance="outline">
          <mat-select multiple formControlName="colores">
            <mat-option *ngFor="let c of colores" [value]="c.id"
              >{{ c.nombre }}</mat-option
            >
          </mat-select>
        </mat-form-field>
      </mat-card-content>
    </mat-card>

    <!-- Materiales -->
    <mat-card>
      <mat-card-header>
        <mat-card-title>Materiales</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-form-field appearance="outline">
          <mat-select multiple formControlName="materiales">
            <mat-option *ngFor="let m of materiales" [value]="m.id"
              >{{ m.nombre }}</mat-option
            >
          </mat-select>
        </mat-form-field>
      </mat-card-content>
    </mat-card>

    <!-- Botones -->
    <div class="form-actions">
      <button
        mat-stroked-button
        type="button"
        color="basic"
        (click)="onCancel()"
      >
        Cancelar
      </button>
      <button
        mat-raised-button
        type="submit"
        color="primary"
        [disabled]="formRelacion.invalid"
      >
        Guardar
      </button>
    </div>
  </form>
</div>
