<div class="toolbar">
  <button mat-raised-button color="primary" (click)="openCreateDialog()">
    Crear Usuario
  </button>
</div>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8 full-width">
  <!-- ID -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let usuario">{{ usuario.id }}</td>
  </ng-container>

  <!-- Nombre -->
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let usuario">{{ usuario.nombre }}</td>
  </ng-container>

  <!-- Correo -->
  <ng-container matColumnDef="correo">
    <th mat-header-cell *matHeaderCellDef>Correo</th>
    <td mat-cell *matCellDef="let usuario">{{ usuario.correo }}</td>
  </ng-container>

  <!-- Rol -->
  <ng-container matColumnDef="rol">
    <th mat-header-cell *matHeaderCellDef>Rol</th>
    <td mat-cell *matCellDef="let usuario">{{ usuario.rol }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let usuario">
      <button
        mat-stroked-button
        color="accent"
        (click)="generarPassword(usuario.id)"
      >
        Contraseña Temporal
      </button>
      <button
        mat-raised-button
        color="primary"
        (click)="openUpdateDialog(usuario)"
      >
        Actualizar
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
